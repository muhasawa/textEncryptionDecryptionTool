<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encryptor Tool</title>
  <!-- Loading CryptoJS library for AES and secure hashing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<style>
  * {
    font-family: 'Courier New', Courier, monospace;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    padding-top: 100px;
    /* padding-left: 40px; */
    /* padding-right: 40px; */
    background-color: #121212;
    color: #e0e0e0;
  }

  .nav {
    position: fixed;
    height: 80px;
    background-color: black;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid aquamarine;
    z-index: 1000;
  }

  .toolName {
    color: aquamarine;
    font-size: 1.7rem;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
  }

  form {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  label {
    font-size: 1.2rem;
    color: aquamarine;
  }

  input, select, textarea {
    font-size: 1.2rem;
    padding: 10px;
    background-color: #222;
    border: 1px solid #444;
    color: #fff;
    border-radius: 4px;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: aquamarine;
  }

  .btn-group {
    display: flex;
    gap: 15px;
    margin-top: 10px;
  }

  button {
    font-size: 1.2rem;
    padding: 10px 20px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    transition: 0.2s;
  }

  .btn-encrypt {
    background-color: aquamarine;
    color: black;
  }

  .btn-encrypt:hover {
    background-color: #56cfb4;
  }

  .btn-decrypt {
    background-color: #222;
    color: aquamarine;
    border: 1px solid aquamarine;
  }

  .btn-decrypt:hover {
    background-color: rgba(127, 255, 212, 0.1);
  }

  .btn-copy {
    background-color: #444;
    color: white;
    font-size: 1rem;
    padding: 5px 10px;
    align-self: flex-start;
  }

  .btn-copy:hover {
    background-color: #555;
  }

  .output-box {
    margin-top: 30px;
    background-color: #1a1a1a;
    padding: 20px;
    border: 1px dashed #444;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 30px;
  }

  .footer {
    height: 40px;
    width: 100%;
    background-color: black;
    color: white;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    
    
  }
</style>
<body>
  <div class="nav">
    <div class="toolName">Encryption & Decryption Tool</div>
  </div>
  
  <div class="container">
    <form id="cryptoForm" onsubmit="return false;">
      <div class="form-group">
        <label for="inputText">Enter Text: </label>
        <textarea id="inputText" rows="4" placeholder="Type your secret message here..." required></textarea>
      </div>

      <div class="form-group">
        <label for="secretKey">Secret Key / Custom Shift: </label>
        <input id="secretKey" type="text" placeholder="e.g., my-secret-password or number 3 for Caesar" required>
      </div>

      <div class="form-group">
        <label for="algorithm">Algorithm: </label>
        <select id="algorithm">
          <option value="">-- Select Algorithm --</option>
          <option value="caesar">Caesar Cipher</option>
          <option value="aes">AES (Advanced Encryption Standard)</option>
          <option value="base64">Base64 Encoding</option>
        </select>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-encrypt" onclick="handleProcess('encrypt')">Encrypt</button>
        <button type="button" class="btn-decrypt" onclick="handleProcess('decrypt')">Decrypt</button>
      </div>
    </form>

    <div class="output-box">
      <label style="display: flex; justify-content: space-between; align-items: center;">
        <span>Result Output:</span>
        <button class="btn-copy" onclick="copyResult()">Copy to Clipboard</button>
      </label>
      <textarea id="outputText" rows="4" readonly placeholder="Your result will appear here..."></textarea>
    </div>
  </div>

  <div class="footer">
    Muhammad Hasnain Awan (03 - 134222 - 063)
  </div>

  <script>
    // --- 1. Caesar Cipher Implementation ---
    function caesarCipher(text, shift, decrypt = false) {
      let s = parseInt(shift);
      if (isNaN(s)) return "Error: Caesar Cipher requires a numerical key/shift.";
      if (decrypt) s = (26 - (s % 26)) % 26; // Reverse shift for decryption
      
      return text.split('').map(char => {
        if (char.match(/[a-z]/i)) {
          const code = char.charCodeAt(0);
          const base = (code >= 65 && code <= 90) ? 65 : 97;
          return String.fromCharCode(((code - base + s) % 26) + base);
        }
        return char;
      }).join('');
    }

    // --- 2. Base64 Implementation ---
    function base64Process(text, decrypt = false) {
      try {
        if (!decrypt) {
          return btoa(unescape(encodeURIComponent(text))); // Safe text to Base64
        } else {
          return decodeURIComponent(escape(atob(text))); // Base64 to text
        }
      } catch (e) {
        return "Error: Invalid Base64 string for decryption.";
      }
    }

    // --- 3. Main Controller Logic ---
    function handleProcess(action) {
      const inputText = document.getElementById('inputText').value.trim();
      const secretKey = document.getElementById('secretKey').value.trim();
      const algorithm = document.getElementById('algorithm').value;
      const outputTextArea = document.getElementById('outputText');

      // Validation Rules
      if (!inputText) {
        alert("Please enter some text first.");
        return;
      }
      if (!algorithm) {
        alert("Please select an encryption algorithm.");
        return;
      }
      if (!secretKey && algorithm !== 'base64') {
        alert("This algorithm requires a Secret Key.");
        return;
      }

      let result = "";

      if (action === 'encrypt') {
        // Encryption Branch
        switch(algorithm) {
          case 'caesar':
            result = caesarCipher(inputText, secretKey, false);
            break;
          case 'aes':
            result = CryptoJS.AES.encrypt(inputText, secretKey).toString();
            break;
          case 'base64':
            result = base64Process(inputText, false);
            break;
        }
      } else {
        // Decryption Branch
        switch(algorithm) {
          case 'caesar':
            result = caesarCipher(inputText, secretKey, true);
            break;
          case 'aes':
            try {
              const bytes = CryptoJS.AES.decrypt(inputText, secretKey);
              result = bytes.toString(CryptoJS.enc.Utf8);
              if (!result) throw new Error();
            } catch (e) {
              result = "Error: Decryption failed. Wrong key or corrupted ciphertext.";
            }
            break;
          case 'base64':
            result = base64Process(inputText, true);
            break;
        }
      }

      outputTextArea.value = result;
    }

    // --- Bonus Feature: Copy To Clipboard ---
    function copyResult() {
      const outputText = document.getElementById('outputText');
      if (!outputText.value) {
        alert("Nothing to copy yet!");
        return;
      }
      outputText.select();
      navigator.clipboard.writeText(outputText.value);
      alert("Copied to clipboard!");
    }
  </script>
</body>
</html>
